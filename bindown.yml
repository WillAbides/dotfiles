cache: .bindown
systems:
  - darwin/amd64
  - darwin/arm64
  - freebsd/amd64
  - linux/amd64
dependencies:
  direnv:
    template: direnv
    vars:
      version: 2.28.0
  gitstatus:
    template: gitstatus
    vars:
      version: 1.5.2
  shellcheck:
    template: origin#shellcheck
    vars:
      version: 0.7.2
  starship:
    template: starship
    vars:
      version: 1.24.2
templates:
  direnv:
    url: https://github.com/direnv/direnv/releases/download/v{{.version}}/direnv.{{.os}}-{{.arch}}
    archive_path: direnv.{{.os}}-{{.arch}}
    bin: direnv
    overrides:
      - matcher:
          arch:
            - arm64
          os:
            - darwin
        dependency:
          vars:
            arch: amd64
    required_vars:
      - version
  gitstatus:
    url: https://github.com/romkatv/gitstatus/archive/refs/tags/v{{.version}}.tar.gz
    archive_path: gitstatus-{{.version}}
    link: true
    required_vars:
      - version
  origin#shellcheck:
    url: https://github.com/koalaman/shellcheck/releases/download/v{{.version}}/shellcheck-v{{.version}}.{{.os}}.{{.arch}}.tar.xz
    archive_path: shellcheck-v{{.version}}/shellcheck
    bin: shellcheck
    overrides:
      - matcher:
          os:
            - windows
        dependency:
          url: https://github.com/koalaman/shellcheck/releases/download/v{{.version}}/shellcheck-v{{.version}}.zip
          archive_path: shellcheck-v{{.version}}.exe
      - matcher:
          arch:
            - arm64
          os:
            - darwin
        dependency:
          vars:
            arch: amd64
    substitutions:
      arch:
        amd64: x86_64
    systems:
      - darwin/amd64
      - darwin/arm64
      - linux/amd64
      - windows/amd64
    required_vars:
      - version
  starship:
    homepage: https://starship.rs
    description: The minimal, blazing-fast, and infinitely customizable prompt for any shell!
    url: https://github.com/starship/starship/releases/download/v{{.version}}/starship-{{.arch}}-{{.os}}{{.urlSuffix}}
    archive_path: starship{{.archivePathSuffix}}
    bin: starship
    vars:
      archivePathSuffix: ""
      urlSuffix: .tar.gz
    substitutions:
      arch:
        amd64: x86_64
        arm64: aarch64
      os:
        darwin: apple-darwin
        freebsd: unknown-freebsd
        linux: unknown-linux-musl
    systems:
      - darwin/amd64
      - darwin/arm64
      - freebsd/amd64
      - linux/amd64
    required_vars:
      - version
template_sources:
  origin: https://raw.githubusercontent.com/WillAbides/bindown-templates/master/bindown.yml
