add_newline = false

format = """
$directory\
$git_branch\
$git_commit\
${custom.git_dirty} \
$git_status\
$character
"""

[directory]
style = "blue"
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = "⑂"
format = '[$symbol$branch(:$remote_branch)]($style)'
style = 'cyan'
only_attached = true

[git_commit]
tag_disabled = false
format = '[$tag]($style)'
tag_symbol = ''

[git_status]
ahead = '↑$count'
behind = '↓$count'
diverged = '⇕$ahead_count|$behind_count '
format = '([$ahead_behind]($style) )'
style = 'cyan'

[character]
success_symbol = '[➜](green)'
error_symbol = '[✗](red)'

[custom.git_dirty]
when = 'test -n "$(git status --porcelain)"'
format = "[*](cyan)"
